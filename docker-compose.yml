version: "3.9"

services:
  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: llm-eval-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evaluser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evalpass}
      POSTGRES_DB: ${POSTGRES_DB:-llmeval}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evaluser}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: .
      target: production
    container_name: llm-eval-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://evaluser:evalpass@postgres:5432/llmeval
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      EVAL_TARGET: ${EVAL_TARGET:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./eval-results:/app/eval-results
      - ./datasets:/app/datasets:ro
      - ./configs:/app/configs:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres-data:
