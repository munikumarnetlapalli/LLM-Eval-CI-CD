project:
  name: llm-eval-cicd
  version: "1.0"

target:
  type: mock  # mock | local_rag | http_rag | http_model

model:
  provider: mock  # mock | openai | azure_openai | gemini
  name: gpt-4o
  # api_key: set via environment variable OPENAI_API_KEY
  # For azure_openai also set: endpoint, deployment, api_version

dataset:
  version: v1
  path: datasets/v1/golden.json

rag:
  version: v1
  top_k: 5
  embedding_version: v1
  reranker: none

kb:
  version: KB-001

metrics:
  - faithfulness
  - answer_relevance
  - context_relevance
  - hallucination
  - latency
  - cost

quality_gate:
  faithfulness:
    minimum: 0.90
  answer_relevance:
    minimum: 0.80
  hallucination_rate:
    maximum: 0.05
  context_relevance:
    minimum: 0.80
  p95_latency_ms:
    maximum_ms: 1000
  cost_per_query:
    maximum_usd: 0.02
