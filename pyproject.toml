[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-cicd"
version = "1.0.0"
description = "Automated LLM + RAG Evaluation, Regression Detection, and CI/CD Quality Gates"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Core evaluation
    "openai>=1.40.0",
    "google-generativeai>=0.7.0",
    "httpx>=0.27.0",
    "tiktoken>=0.7.0",

    # Backend
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",

    # Storage
    "azure-storage-blob>=12.22.0",
    "azure-identity>=1.17.0",

    # Observability
    "opencensus-ext-azure>=1.1.13",
    "applicationinsights>=0.11.10",

    # CLI
    "click>=8.1.7",
    "rich>=13.8.0",
    "pyyaml>=6.0.2",
    "tabulate>=0.9.0",

    # Utilities
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "numpy>=1.26.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "faker>=26.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
llm-eval = "evaluator.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["evaluator*", "backend*", "demo_rag*"]

[tool.pytest.ini_options]
testpaths = ["evaluator/tests", "backend/tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
