name: LLM Eval CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'evaluator/**'
      - 'backend/**'
      - 'configs/**'
      - 'datasets/**'
      - 'demo_rag/**'
      - 'pyproject.toml'
  pull_request:
    branches: [main]
    paths:
      - 'evaluator/**'
      - 'backend/**'
      - 'configs/**'
      - 'datasets/**'
      - 'demo_rag/**'

env:
  PYTHON_VERSION: "3.11"
  STORAGE_BACKEND: local
  LLM_PROVIDER: mock
  EVAL_TARGET: mock

jobs:
  # ─── Job 1: Unit Tests ────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest evaluator/tests/ backend/tests/ -v --tb=short --cov=evaluator --cov-report=term-missing
        env:
          LLM_PROVIDER: mock
          STORAGE_BACKEND: local

      - name: Validate golden dataset
        run: llm-eval dataset validate datasets/v1

  # ─── Job 2: Golden Evaluation ─────────────────────────────────────────────
  golden-evaluation:
    name: Run Golden Evaluation
    runs-on: ubuntu-latest
    needs: unit-tests
    outputs:
      run_id: ${{ steps.eval.outputs.run_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run evaluation
        id: eval
        run: |
          OUTPUT=$(llm-eval run --config configs/evaluation.yaml --environment ci --output eval-result.json)
          echo "$OUTPUT"
          RUN_ID=$(python -c "import json; d=json.load(open('eval-result.json')); print(d['run_id'])")
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
        env:
          LLM_PROVIDER: mock
          STORAGE_BACKEND: local

      - name: Upload eval result
        uses: actions/upload-artifact@v4
        with:
          name: eval-result
          path: eval-result.json
          retention-days: 30

  # ─── Job 3: Quality Gate ──────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: golden-evaluation

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Download eval result
        uses: actions/download-artifact@v4
        with:
          name: eval-result

      - name: Restore eval result to storage
        run: |
          mkdir -p eval-results
          RUN_ID=$(python -c "import json; d=json.load(open('eval-result.json')); print(d['run_id'])")
          cp eval-result.json "eval-results/${RUN_ID}.json"
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Evaluate quality gate
        # CRITICAL: This step MUST exit non-zero on gate failure.
        # A passing pipeline that silently ignores a gate failure defeats the project's purpose.
        run: |
          llm-eval gate --run $RUN_ID --config configs/evaluation.yaml
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::QUALITY GATE FAILED — Deployment blocked"
            exit 1
          fi
        env:
          STORAGE_BACKEND: local

  # ─── Job 4: Docker Build & Size Check ─────────────────────────────────────
  docker-build:
    name: Docker Build + Size Check
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t llm-eval-cicd:${{ github.sha }} .

      - name: Check image size
        run: python scripts/check_image_size.py llm-eval-cicd:${{ github.sha }}

  # ─── Job 5: Deploy to Azure (main branch only, after gate passes) ─────────
  deploy-azure:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [quality-gate, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push to ACR
        run: |
          az acr build \
            --registry ${{ secrets.ACR_NAME }} \
            --image llm-eval-cicd:${{ github.sha }} \
            --image llm-eval-cicd:latest \
            .

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/llm-eval-cicd:${{ github.sha }}

      - name: Verify deployment health
        run: |
          sleep 30
          curl -f "${{ secrets.APP_URL }}/api/v1/health" || exit 1
